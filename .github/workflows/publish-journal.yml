name: Publish journal entry

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'journal-entry') || (contains(github.event.issue.body, '### Chinese title') && contains(github.event.issue.body, '### English title') && contains(github.event.issue.body, '### Chinese body') && contains(github.event.issue.body, '### English body'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish journal files
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: python3 tools/publish_journal_issue.py

      - name: Commit generated journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No journal changes to commit."
            exit 0
          fi
          git add index.html agent-index.json rss.xml sitemap.xml content journal
          git commit -m "Publish journal from issue #${{ github.event.issue.number }}"
          git push

      - name: Comment with published link
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "Published or updated this journal entry.",
              "",
              "If GitHub Pages is enabled, the page should appear after the Pages build finishes."
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
